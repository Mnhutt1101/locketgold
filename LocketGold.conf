#!name=LocketGold-Clean
#!desc=Locket Gold Local Configuration (No Worker, No Welcome Popup)
#!icon=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Locket.png
#!system=ios

[Rule]
# Chặn QUIC/UDP cho Locket
AND,((DOMAIN,firebaseremoteconfig.googleapis.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,api.revenuecat.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,api.locketcamera.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN-SUFFIX,locketcamera.com),(PROTOCOL,UDP)),REJECT

# Chặn Sentry
DOMAIN-SUFFIX,sentry.io,REJECT
DOMAIN-SUFFIX,ingest.sentry.io,REJECT

[Header Rewrite]
# Xóa Cache / ETag trên RevenueCat
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del x-revenuecat-etag
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del X-RevenueCat-ETag
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del if-none-match
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del If-None-Match
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del if-modified-since
^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers) header-del If-Modified-Since

# Xóa Cache / ETag trên Firebase Remote Config
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+ header-del if-none-match
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+ header-del If-None-Match
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+ header-del if-modified-since
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+ header-del If-Modified-Since
^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+ header-del x-goog-if-none-match

# Xóa Cache / ETag trên Locket Camera API
^https?:\/\/api\.locketcamera\.com\/.+ header-del if-none-match
^https?:\/\/api\.locketcamera\.com\/.+ header-del If-None-Match
^https?:\/\/api\.locketcamera\.com\/.+ header-del if-modified-since
^https?:\/\/api\.locketcamera\.com\/.+ header-del If-Modified-Since

[Script]
deleteHeader_RC = type=http-request,pattern=^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers),script-path=https://raw.githubusercontent.com/Mnhutt1101/locketgold/main/deleteHeader_RC.js,timeout=60

deleteHeader_Firebase = type=http-request,pattern=^https?:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+,script-path=https://raw.githubusercontent.com/Mnhutt1101/locketgold/main/deleteHeader_Firebase.js,timeout=60

revenuecat = type=http-response,pattern=^https?:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers),script-path=https://raw.githubusercontent.com/Mnhutt1101/locketgold/main/revenuecat.js,requires-body=true,max-size=-1,timeout=60

locket_rc = type=http-response,pattern=^https:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+,script-path=https://raw.githubusercontent.com/Mnhutt1101/locketgold/main/locketfix.js,requires-body=true,max-size=-1,timeout=60

locket_change_profile = type=http-request,pattern=^https:\/\/api\.locketcamera\.com\/changeProfileInfo,script-path=https://raw.githubusercontent.com/Mnhutt1101/locketgold/main/locket_change_profile.js,timeout=60

locket_filter_resp = type=http-response,pattern=^https?:\/\/api\.locketcamera\.com\/.+,requires-body=true,max-size=-1,script-path=https://raw.githubusercontent.com/Mnhutt1101/locketgold/main/locket_filter_resp.js,timeout=60

[Host]
firebaseremoteconfigrealtime.googleapis.com = 0.0.0.0

[MITM]
hostname = %APPEND% api.revenuecat.com, firebaseremoteconfig.googleapis.com, api.locketcamera.com, *.locketcamera.com
